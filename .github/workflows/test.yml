name: Test website

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile app.py
      - name: Smoke test homepage and admin
        run: python -m unittest discover -s tests -v
