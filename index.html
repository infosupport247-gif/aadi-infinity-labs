<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AADi Infinity Labs</title><style>
:root{color-scheme:dark;--gold:#d9b875;--bg:#080b12;--muted:#aab2c1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f5f1;font:16px system-ui,sans-serif}a{color:inherit;text-decoration:none}header,footer{padding:24px max(5vw,20px);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid #ffffff15}nav{display:flex;gap:22px;flex-wrap:wrap;font-size:14px}nav a:hover{color:var(--gold)}.brand{color:var(--gold);letter-spacing:2px;font-weight:700}.hero{text-align:center;padding:80px 20px 55px;background:radial-gradient(ellipse at 50% 70%,#23304a 0%,#101522 38%,#080b12 75%)}.eyebrow{color:var(--gold);letter-spacing:4px;font-size:12px;text-transform:uppercase}h1{font-size:clamp(44px,8vw,100px);line-height:1.02;letter-spacing:-.055em;margin:24px auto;max-width:900px}h2{font-size:clamp(26px,4vw,42px);letter-spacing:-.035em}p{color:var(--muted);line-height:1.7}.btn,button{display:inline-block;background:var(--gold);color:#10131a;border:0;border-radius:8px;padding:13px 22px;font-weight:700;cursor:pointer}.infinity{width:min(540px,90%);margin:30px auto 0;display:block;filter:drop-shadow(0 0 24px #cba45a66);animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}section{max-width:1200px;margin:auto;padding:50px 24px}.center{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.tile{border:1px solid #ffffff18;background:linear-gradient(145deg,#171d29,#0e131d);padding:25px;border-radius:18px;min-width:0}.tile:hover{border-color:#d9b87588}.glyph{font-size:32px;color:var(--gold)}.tag{font-size:12px;color:var(--gold);letter-spacing:1px}.appicon{width:64px;height:64px;border-radius:16px;object-fit:cover}.muted{color:var(--muted)}footer{border-top:1px solid #ffffff15;border-bottom:0;font-size:13px}.form{display:grid;gap:12px;max-width:850px}input,textarea,select{width:100%;background:#151b26;border:1px solid #394151;border-radius:8px;color:white;padding:12px;font:inherit}textarea{min-height:110px}label{display:grid;gap:6px;color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:#252d3b;color:white}.danger{background:#783333;color:white}.legal{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;color:#d7dbe3}.shots{width:100%;max-width:300px;border-radius:14px}#msg{color:var(--gold)}a:focus-visible,button:focus-visible{outline:3px solid white;outline-offset:3px}
</style><header><a class="brand" href="#/">∞ <span id="brand">AADi INFINITY LABS</span></a><nav><a href="#apps">Applications</a><a href="#/about">About</a><a href="#/support">Support</a><a href="#/contact">Contact</a></nav></header><main id="main"></main><footer><span>© 2026 AADi Infinity Labs.</span><nav><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a><a href="#/delete-account">Account deletion</a></nav></footer><script>
const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), U=s=>{try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?E(u.href):''}catch{return ''}};let data;const api=async()=>({"settings":{"brand":"AADi INFINITY LABS","tagline":"Indian Roots. Infinite Vision.","headline":"Building Beyond Boundaries.","intro":"Technology inspired by heritage. Innovation designed for humanity.","about":"A technology studio inspired by Indian heritage and driven by global innovation.","email":""},"apps":[{"slug":"storynest","name":"StoryNest AI","category":"Education","description":"Imaginative storytelling experiences.","status":"In development","store":"","icon":"","screenshots":"","privacy":"","terms":"","support":"","deletion":""},{"slug":"closetiq","name":"ClosetIQ AI","category":"Lifestyle","description":"Smart wardrobe organization.","status":"In development","store":"","icon":"","screenshots":"","privacy":"","terms":"","support":"","deletion":""},{"slug":"vibiq","name":"VIBIQ","category":"Social technology","description":"Let the vibe find you.","status":"In development","store":"","icon":"","screenshots":"","privacy":"","terms":"","support":"","deletion":""},{"slug":"vibeme","name":"VibeMe AI","category":"Creativity","description":"Creative visual transformation.","status":"In development","store":"","icon":"","screenshots":"","privacy":"","terms":"","support":"","deletion":""},{"slug":"memorymovie","name":"MemoryMovie AI","category":"Entertainment","description":"Turn memories into cinematic experiences.","status":"In development","store":"","icon":"","screenshots":"","privacy":"","terms":"","support":"","deletion":""},{"slug":"bhakti","name":"Aadi Anant Bhakti Dhara","category":"Culture","description":"Devotional music and Indian heritage.","status":"In development","store":"","icon":"","screenshots":"","privacy":"","terms":"","support":"","deletion":""}]});const card=a=>`<a class="tile" href="#/app/${E(a.slug)}">${U(a.icon)?`<img class="appicon" src="${U(a.icon)}" alt="">`:'<div class="glyph">◈</div>'}<p class="tag">${E(a.category)}</p><h3>${E(a.name)}</h3><p>${E(a.description)}</p><span class="tag">${E(a.status)} · Explore →</span></a>`;const wrap=(title,body)=>`<section><p class="eyebrow">AADi Infinity Labs</p><h2>${E(title)}</h2>${body}</section>`;const links=kind=>data.apps.map(a=>`<p><a href="#/legal/${kind}/${E(a.slug)}">${E(a.name)} →</a></p>`).join('');
async function render(){data=await api('site');let s=data.settings,p=location.hash.replace(/^#/, '').split('/').filter(Boolean),m=$('#main');$('#brand').textContent=s.brand;if(!p.length||p[0]==='apps'){m.innerHTML=`<div class="hero"><div class="eyebrow">${E(s.tagline)}</div><h1>${E(s.headline)}</h1><p>${E(s.intro)}</p><a class="btn" href="#apps">Explore Our Innovations</a><svg class="infinity" viewBox="0 0 500 220" role="img" aria-label="Golden infinity symbol"><defs><linearGradient id="g"><stop stop-color="#8d652d"/><stop offset=".5" stop-color="#fff0bb"/><stop offset="1" stop-color="#c79c52"/></linearGradient></defs><path d="M250 110 C170 -5 55 0 55 110 S170 225 250 110 S445 -5 445 110 S330 225 250 110" fill="none" stroke="url(#g)" stroke-width="13" stroke-linecap="round"/></svg></div><section class="center"><p class="eyebrow">Our expertise</p><h2>One Vision. Infinite Possibilities.</h2><div class="grid">${['Artificial Intelligence','Mobile Applications','Digital Experiences','Future Technologies'].map((x,i)=>`<div class="tile"><div class="glyph">${['✧','▣','▷','∞'][i]}</div><h3>${x}</h3></div>`).join('')}</div></section><section id="apps"><p class="eyebrow">Our ecosystem</p><h2>Discover Our Applications</h2><div class="grid">${data.apps.map(card).join('')}</div></section><section class="center"><h2>Inspired by India.<br>Designed for the World.</h2><p>${E(s.about)}</p></section>`}else if(p[0]==='admin'){m.innerHTML=wrap('Administration','<p>Managed privately through the source repository.</p>')}else if(p[0]==='app'){let a=data.apps.find(x=>x.slug===p[1]);m.innerHTML=a?wrap(a.name,`<p class="tag">${E(a.category)} · ${E(a.status)}</p><p>${E(a.description)}</p>${U(a.store)?`<a class="btn" href="${U(a.store)}">View on App Store</a>`:''}<div class="grid">${a.screenshots.split('\n').filter(U).map(x=>`<img class="shots" src="${U(x)}" alt="Application screenshot">`).join('')}</div><p>${['privacy','terms','support','deletion'].map(k=>`<a href="#/legal/${k}/${E(a.slug)}">${k} →</a>`).join('　')}</p>`):wrap('Not found','')}else if(p[0]==='legal'){let a=data.apps.find(x=>x.slug===p[2]),k=p[1];m.innerHTML=wrap((a?.name||'Application')+' · '+k,`<div class="legal">${E(a&&['privacy','terms','support','deletion'].includes(k)&&a[k]||'Information has not yet been published. Please check back before using this service.')}</div>`)}else if(p[0]==='about'){m.innerHTML=wrap('About us',`<p>${E(s.about)}</p>`)}else if(p[0]==='contact'){m.innerHTML=wrap('Contact',`<p>${E(s.email||'Contact details have not yet been published.')}</p>`)}else{let k=p[0]==='delete-account'?'deletion':p[0];m.innerHTML=wrap(p[0],links(k))}}
window.addEventListener('hashchange',()=>{render().then(()=>{if(location.hash==='#apps')document.getElementById('apps')?.scrollIntoView();else window.scrollTo(0,0)})});render().catch(e=>$('#main').textContent=e.message);</script></html>
